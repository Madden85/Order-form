<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numo Ventures - Create Order</title>
    <style>
        body { margin: 0; font-family: Arial; background: #0d0d0d; color: #fff; text-align: center; }
        .wrap { width: 92%; max-width: 480px; margin: auto; padding: 20px 0; }
        .card { background: #161616; padding: 20px; border-radius: 14px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; background: #222; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: block; text-decoration: none; }
        .btn-red { background: #e50914; color: #fff; }
        .btn-green { background: #0f9d58; color: #fff; margin-top: 10px; }
        .output { white-space: pre-line; text-align: left; background: #000; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #e50914; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="wrap">
        <h2>NUMO VENTURES</h2>
        <div class="card">
            <select id="product" onchange="renderForm()">
                <option value="">-- PILIH PRODUK --</option>
                <option>Netflix premium private profile</option>
                <option>Youtube Premium Own email</option>
                <option>Youtube premium seller email</option>
                <option>Sooka premium</option>
                <option>Spotify premium</option>
                <option>iqiyi premium</option>
                <option>disney+ hotstar</option>
                <option>viu premium</option>
            </select>
            <div id="form"></div>
            <button class="btn btn-red" id="submitBtn">SUBMIT & COPY</button>
            <div id="result" class="output hidden"></div>
            <a id="openTelegram" class="btn btn-green hidden" target="_blank">HANTAR KE CUSTOMER</a>
        </div>
    </div>
    <script src="app.js?v=99"></script>
</body>
</html>
