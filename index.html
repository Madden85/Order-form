<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numo Ventures - Create Order</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d0d;
            color: #fff;
            text-align: center;
        }
        .wrap {
            width: 92%;
            max-width: 480px;
            margin: auto;
            padding: 20px 0;
        }
        h2 {
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: #e50914; /* Warna merah Netflix */
        }
        .card {
            background: #161616;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-size: 0.9em;
            color: #aaa;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
            box-sizing: border-box;
            font-size: 1em;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #e50914;
        }
        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            display: block;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-primary {
            background: #e50914;
            color: #fff;
        }
        .btn-primary:hover {
            background: #b20710;
        }
        .btn-green {
            background: #0f9d58;
            color: #fff;
            margin-top: 10px;
        }
        .btn-green:hover {
            background: #0b7a44;
        }
        .output {
            white-space: pre-line;
            text-align: left;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #e50914;
            font-size: 0.95em;
            line-height: 1.5;
        }
        .hidden {
            display: none;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #555;
        }
    </style>
</head>
<body>

<div class="wrap">
    <h2>NUMO VENTURES</h2>
    
    <div class="card">
        <label for="product">Sila Pilih Produk:</label>
        <select id="product" onchange="renderForm()">
            <option value="">-- PILIH PRODUK --</option>
            <option value="netflix">Netflix premium private profile</option>
            <option value="youtube_own">Youtube Premium Own email</option>
            <option value="youtube_seller">Youtube premium seller email</option>
            <option value="sooka">Sooka premium</option>
            <option value="spotify">Spotify premium</option>
            <option value="iqiyi">iqiyi premium</option>
            <option value="disney">disney+ hotstar</option>
            <option value="viu">viu premium</option>
        </select>

        <div id="form"></div>

        <button class="btn btn-primary" id="submitBtn">SUBMIT & COPY</button>

        <div id="result" class="output hidden"></div>

        <a id="openTelegram" class="btn btn-green hidden" target="_blank">HANTAR KE CUSTOMER</a>
    </div>

    <div class="footer">
        &copy; 2026 Numo Ventures Management
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
